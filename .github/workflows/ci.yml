name: QCOM Backend CI (PostgreSQL 16 & Redis 7 Integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: All 55 Test Suites & Infrastructure Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qcom_test
          POSTGRES_USER: qcom_user
          POSTGRES_PASSWORD: qcom_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.0.15-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://qcom_user:qcom_password@127.0.0.1:5432/qcom_test
      TEST_DATABASE_URL: postgres://qcom_user:qcom_password@127.0.0.1:5432/qcom_test
      REDIS_URL: redis://127.0.0.1:6379
      EXPECTED_REDIS_VERSION: '7.0.15'
      FORCE_REDIS: '1'
      PORT: 4000
      JWT_SECRET: qcom_ci_test_jwt_secret_token_1234567890
      PAYMENT_MODE: mock
      TELEPHONY_MODE: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root and backend dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix QCOM/backend --legacy-peer-deps

      - name: Provision isolated CI databases and verify PostgreSQL 16 & Redis 7.0.15
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/QCOM/backend/node_modules
        run: |
          node -e "const pg=require('./node_modules/pg'); const p=new pg.Pool({connectionString:process.env.TEST_DATABASE_URL}); (async()=>{ const v=await p.query('SELECT version()'); console.log('PG:',v.rows[0].version); for (const db of ['qcom_staging','qcom_db']) { const r=await p.query('SELECT 1 FROM pg_database WHERE datname=\$1',[db]); if (r.rowCount===0) await p.query('CREATE DATABASE '+db+' OWNER qcom_user'); } await p.end(); })();"
          npx tsx QCOM/backend/scripts/verify-redis-version.ts

      - name: Run database migrations (001-026)
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/QCOM/backend/node_modules
        run: npx tsx QCOM/backend/scripts/migrate.ts

      - name: Run database seeds
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/QCOM/backend/node_modules
        run: npx tsx QCOM/backend/scripts/seed.ts

      - name: Run all 55 backend automated test suites
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/QCOM/backend/node_modules
        run: npx tsx QCOM/backend/tests/run-all-tests.ts

      - name: Run typecheck, lint and build (root and backend)
        run: |
          npx tsc --noEmit
          npm run lint
          npm --prefix QCOM/backend run build
          npm run build

  real-services-integration:
    name: Real-Services Integration Harness (PG 16 & Redis 7.0.15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root and backend dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix QCOM/backend --legacy-peer-deps

      - name: Start isolated PostgreSQL 16.6 & Redis 7.0.15 integration containers
        run: |
          PG_PW=$(openssl rand -hex 16)
          RD_PW=$(openssl rand -hex 16)
          echo "QCOM_IT_POSTGRES_PASSWORD=$PG_PW" >> "$GITHUB_ENV"
          echo "QCOM_IT_REDIS_PASSWORD=$RD_PW" >> "$GITHUB_ENV"
          echo "::add-mask::$PG_PW"
          echo "::add-mask::$RD_PW"
          docker compose -f QCOM/backend/docker-compose.integration.yml up -d --wait

      - name: Verify exact Redis 7.0.15 & PostgreSQL 16 versions
        run: |
          docker compose -f QCOM/backend/docker-compose.integration.yml exec -T postgres psql -U qcom_it_admin -d postgres -tAc "SELECT version();"
          docker compose -f QCOM/backend/docker-compose.integration.yml exec -T redis sh -c 'REDISCLI_AUTH="$QCOM_IT_REDIS_PASSWORD" redis-cli INFO server | grep "^redis_version:"'

      - name: Run real-services integration suite
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules:${{ github.workspace }}/QCOM/backend/node_modules
        run: |
          QCOM_IT_POSTGRES_URL="postgresql://qcom_it_admin:${QCOM_IT_POSTGRES_PASSWORD}@127.0.0.1:55432/postgres" \
          QCOM_IT_REDIS_URL="redis://:${QCOM_IT_REDIS_PASSWORD}@127.0.0.1:56379/0" \
          npm --prefix QCOM/backend run test:integration:real-services

      - name: Tear down isolated integration containers
        if: always()
        run: docker compose -f QCOM/backend/docker-compose.integration.yml down -v
