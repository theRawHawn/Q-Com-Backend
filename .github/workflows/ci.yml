name: QCOM Backend CI (PostgreSQL 16 & Redis 7 Integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: All 54 Test Suites & Infrastructure Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qcom_test
          POSTGRES_USER: qcom_user
          POSTGRES_PASSWORD: qcom_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://qcom_user:qcom_password@127.0.0.1:5432/qcom_test
      REDIS_URL: redis://127.0.0.1:6379
      FORCE_REDIS: '1'
      PORT: 4000
      JWT_SECRET: qcom_ci_test_jwt_secret_token_1234567890
      PAYMENT_MODE: mock
      TELEPHONY_MODE: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run database migrations (001-026)
        run: npx tsx QCOM/backend/scripts/migrate.ts

      - name: Run database seeds
        run: npx tsx QCOM/backend/scripts/seed.ts

      - name: Run all 54 backend automated test suites
        run: npx tsx QCOM/backend/tests/run-all-tests.ts

      - name: Run typecheck
        run: npx tsc --noEmit
